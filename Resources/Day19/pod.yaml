apiVersion: v1
kind: Pod
metadata:
  name: myapp
  labels:
    name: myapp-prod
spec:
  containers:
  - name: myapp-container
    image: busybox:1.28
    env:
    - name: FIRSTNAME
      valueFrom:
        configMapKeyRef:
          name: app-cm
          key: username
    command: ['sh', '-c', 'echo the app is running && sleep 3600']
  