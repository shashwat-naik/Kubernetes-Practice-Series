apiVersion: v1
kind: Pod
metadata:
  labels:
    run: redis
  name: redis
spec:
  containers:
  - image: redis
    name: redis-taint
    resources: {}
  dnsPolicy: ClusterFirst
  restartPolicy: Always
  # Toleration is added below this line, taint has been applied to the node worker for gpu=true:NoSchedule
  tolerations:
  - key: "gpu"
    operator: "Equal"
    value: "true"
    effect: "NoSchedule" 
status: {}
